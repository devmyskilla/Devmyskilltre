name: Sync course catalogs V2

on:
  workflow_dispatch:
  schedule:
    - cron: '17 2 * * 0'

permissions:
  contents: write

concurrency:
  group: course-catalog-sync-v2
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify catalog V2 tests
        run: node --test tests/catalog-tools.test.mjs tests/catalog-v2.test.mjs tests/sync-workflow.test.js tests/sync-workflow-v2.test.js
      - name: Sync and clean official catalogs
        env:
          CATALOG_TIMEOUT_MS: '15000'
          CATALOG_SITEMAP_LIMIT: '16'
          CATALOG_URL_LIMIT: '5000'
        run: node scripts/sync-course-catalogs.mjs --all
      - name: Commit catalog changes
        shell: bash
        run: |
          git config user.name "dunya-catalog-bot"
          git config user.email "actions@users.noreply.github.com"
          git add catalogs/
          if git diff --cached --quiet; then
            echo "No catalog changes"
            exit 0
          fi
          git commit -m "chore: sync and clean course catalogs v2"
          git push
