name: Apply official course image UI

on:
  push:
    paths:
      - '.github/workflows/apply-course-image-ui.yml'
      - 'scripts/apply_course_image_ui.py'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply focused UI changes
        run: python scripts/apply_course_image_ui.py
      - name: Test official image UI
        run: node --test tests/course-image-ui.test.js
      - name: Syntax check
        run: node --check js/app.js && node --check js/platform-detail.js
      - name: Verify diff
        run: git diff --check
      - name: Commit verified UI fix
        shell: bash
        run: |
          git config user.name "dunya-ui-bot"
          git config user.email "actions@users.noreply.github.com"
          git add js/app.js js/platform-detail.js css/style.css
          if git diff --cached --quiet; then
            echo "No UI changes"
            exit 0
          fi
          git commit -m "fix: display official FutureLearn course images"
          git push
