name: Test Supabase catalog runtime

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'js/supabase-*.js'
      - 'js/app.js'
      - 'js/platform-detail.js'
      - 'index.html'
      - 'platform.html'
      - 'sw.js'
      - 'tests/supabase-runtime.test.js'
      - 'tests/theme-storage.test.js'
      - '.github/workflows/test-supabase-runtime.yml'

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Repair legacy homepage theme key
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('js/app.js')
          text = path.read_text(encoding='utf-8')
          old = 'localStorage.getItem(STORAGE_THEME)'
          new = 'localStorage.getItem(STORAGE.theme)'
          if old in text:
              text = text.replace(old, new, 1)
              path.write_text(text, encoding='utf-8')
          if old in path.read_text(encoding='utf-8'):
              raise SystemExit('legacy STORAGE_THEME reference still exists')
          PY
      - name: Supabase runtime tests
        run: node --test tests/supabase-runtime.test.js
      - name: Homepage theme regression test
        run: node --test tests/theme-storage.test.js
      - name: Existing live catalog regression tests
        run: node --test tests/live-catalog-runtime.test.js
      - name: JavaScript syntax checks
        run: node --check js/supabase-runtime.js && node --check js/supabase-config.js && node --check js/app.js && node --check js/platform-detail.js
      - name: Verify live Supabase Data API and RLS
        shell: bash
        run: |
          set -euo pipefail
          body=$(curl --fail --silent --show-error \
            'https://pptjaflkltwavyktzphw.supabase.co/rest/v1/courses?select=id%2Cexternal_id%2Ctitle%2Cstatus%2Cplatforms%21inner%28id%2Cexternal_id%2Cname%29%2Ccategories%28id%2Cslug%2Cname%29&status=eq.verified&limit=1' \
            -H 'apikey: sb_publishable_lUq2yPmkTijaqyYDifTYFA_Es-Xi7Nb')
          node -e "const rows=JSON.parse(process.argv[1]); if(!Array.isArray(rows)||rows.length!==1||rows[0].status!=='verified') process.exit(1);" "$body"
      - name: Commit verified theme repair
        shell: bash
        run: |
          git config user.name "dunya-catalog-bot"
          git config user.email "actions@users.noreply.github.com"
          git add js/app.js
          if git diff --cached --quiet; then
            echo "No theme repair needed"
            exit 0
          fi
          git commit -m "fix: use defined theme storage key"
          git push
