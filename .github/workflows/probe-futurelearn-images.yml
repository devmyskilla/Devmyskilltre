name: Probe FutureLearn course images

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/probe-futurelearn-images.yml'

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Fetch FutureLearn course HTML directly
        shell: bash
        run: |
          set -euo pipefail
          url='https://www.futurelearn.com/courses/health-research-ethics'
          code=$(curl -L --silent --show-error --max-time 30 \
            -A 'Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/140 Safari/537.36' \
            -w '%{http_code}' -o /tmp/course.html "$url")
          echo "HTTP $code bytes $(wc -c </tmp/course.html)"
          echo '--- image metadata ---'
          grep -Eio -m 20 '<meta[^>]+(og:image|twitter:image)[^>]+>|https://ugc\.futurelearn\.com/[^"'"'"' <)]+' /tmp/course.html || true
          echo '--- title ---'
          grep -Eio -m 3 '<title>[^<]+'</title' /tmp/course.html || true
