name: Probe FutureLearn course images

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/probe-futurelearn-images.yml'

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Fetch a non-featured FutureLearn course through Reader
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --max-time 60 \
            'https://r.jina.ai/https://www.futurelearn.com/courses/health-research-ethics' \
            -o /tmp/course.md
          echo '--- official artwork lines ---'
          grep -E -m 30 'ugc\.futurelearn\.com|header_|thumbnail_|Image' /tmp/course.md || true
          echo '--- first 140 lines ---'
          sed -n '1,140p' /tmp/course.md
